spring.application.name=dossier
spring.main.web-application-type=none
spring.messages.encoding=UTF-8

server.port=0
deal.url=http://localhost:8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=dossier-service-ci
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.credithandler.api.dto.dossier,com.credithandler.api.dto.model,com.credithandler.api.dto.loan
spring.kafka.consumer.properties.spring.json.value.default.type=com.credithandler.api.dto.dossier.EmailMessage

kafka.topic.finish-registration=finish-registration
kafka.topic.create-documents=create-documents
kafka.topic.send-documents=send-documents
kafka.topic.send-ses=send-ses
kafka.topic.credit-issued=credit-issued
kafka.topic.statement-denied=statement-denied

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=ci
spring.mail.password=ci
spring.mail.from=ci@example.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

dossier.documents.storage-path=target/dossier-documents-ci
dossier.documents.pdf-content-type=application/pdf
dossier.documents.file-extension=.pdf
dossier.documents.contract-base-name=credit-contract
dossier.documents.payment-schedule-base-name=payment-schedule
dossier.documents.individual-conditions-base-name=individual-conditions
dossier.documents.font.path=C:/Windows/Fonts/arial.ttf,/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf,/usr/share/fonts/dejavu/DejaVuSans.ttf

logging.level.com.credithandler.dossier=INFO

error.business-code=422
error.validation-code=400
error.server-code=500
