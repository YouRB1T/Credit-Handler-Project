spring.application.name=dossier
spring.main.web-application-type=none
spring.messages.encoding=UTF-8

server.port=${APP_PORT}
deal.url=${DEAL_URL}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.credithandler.api.dto.dossier,com.credithandler.api.dto.model,com.credithandler.api.dto.loan
spring.kafka.consumer.properties.spring.json.value.default.type=com.credithandler.api.dto.dossier.EmailMessage

kafka.topic.finish-registration=${KAFKA_TOPIC_FINISH_REGISTRATION}
kafka.topic.create-documents=${KAFKA_TOPIC_CREATE_DOCUMENTS}
kafka.topic.send-documents=${KAFKA_TOPIC_SEND_DOCUMENTS}
kafka.topic.send-ses=${KAFKA_TOPIC_SEND_SES}
kafka.topic.credit-issued=${KAFKA_TOPIC_CREDIT_ISSUED}
kafka.topic.statement-denied=${KAFKA_TOPIC_STATEMENT_DENIED}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

dossier.documents.storage-path=${DOSSIER_DOCUMENTS_STORAGE_PATH}
dossier.documents.pdf-content-type=${DOSSIER_DOCUMENTS_PDF_CONTENT_TYPE}
dossier.documents.file-extension=${DOSSIER_DOCUMENTS_FILE_EXTENSION}
dossier.documents.contract-base-name=${DOSSIER_DOCUMENTS_CONTRACT_BASE_NAME}
dossier.documents.payment-schedule-base-name=${DOSSIER_DOCUMENTS_PAYMENT_SCHEDULE_BASE_NAME}
dossier.documents.individual-conditions-base-name=${DOSSIER_DOCUMENTS_INDIVIDUAL_CONDITIONS_BASE_NAME}
dossier.documents.font.path=${DOSSIER_DOCUMENTS_FONT_PATH}

logging.level.com.credithandler.dossier=${DOSSIER_LOG_LEVEL}

error.business-code=${ERROR_BUSINESS_CODE}
error.validation-code=${ERROR_VALIDATION_CODE}
error.server-code=${ERROR_SERVER_CODE}
