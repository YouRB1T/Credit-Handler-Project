services:
  postgres:
    image: postgres:17-alpine
    container_name: credit-handler-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_db}

      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - credit-handler

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: credit-handler-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_HOST_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - credit-handler

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: credit-handler-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - credit-handler

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: credit-handler-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - credit-handler

  calculator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: calculator
    image: credit-handler/calculator:local
    container_name: credit-handler-calculator
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "${CALCULATOR_HOST_PORT:-8081}:8080"
    networks:
      - credit-handler

  deal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: deal
    image: credit-handler/deal:local
    container_name: credit-handler-deal
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      calculator:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-credit_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CALCULATOR_URL: ${CALCULATOR_URL:-http://calculator:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "${DEAL_HOST_PORT:-8082}:8080"
    networks:
      - credit-handler

  statement:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: statement
    image: credit-handler/statement:local
    container_name: credit-handler-statement
    env_file:
      - ./.env
    depends_on:
      deal:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
      DEAL_URL: ${DEAL_URL:-http://deal:8080}
    ports:
      - "${STATEMENT_HOST_PORT:-8083}:8080"
    networks:
      - credit-handler

  dossier:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: dossier
    image: credit-handler/dossier:local
    container_name: credit-handler-dossier
    env_file:
      - ./.env
    depends_on:
      kafka:
        condition: service_healthy
      deal:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
      DEAL_URL: ${DEAL_URL:-http://deal:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      DOSSIER_DOCUMENTS_STORAGE_PATH: ${DOSSIER_DOCUMENTS_STORAGE_PATH:-/app/dossier-documents}
    volumes:
      - dossier-documents:/app/dossier-documents
    networks:
      - credit-handler

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    image: credit-handler/gateway:local
    container_name: credit-handler-gateway
    env_file:
      - ./.env
    depends_on:
      statement:
        condition: service_started
      deal:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_PORT: ${APP_PORT:-8080}
      DEAL_URL: ${DEAL_URL:-http://deal:8080}
      STATEMENT_URL: ${STATEMENT_URL:-http://statement:8080}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - credit-handler

networks:
  credit-handler:
    name: credit-handler-network

volumes:
  postgres-data:
  dossier-documents:
